name: Build Apple XNU kernels

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_handoff_capture:
        description: Run the optional arm64 handoff smoke capture with an external XNU Mach-O artifact
        required: false
        default: false
        type: boolean
      xnu_kernel_artifact_url:
        description: Optional URL for an external arm64 XNU Mach-O used by the handoff capture step
        required: false
        type: string
      xnu_efi_loader_url_amd64:
        description: Optional URL for BOOTX64.EFI used to package and smoke boot an amd64 ISO
        required: false
        type: string
      xnu_efi_loader_url_arm64:
        description: Optional URL for BOOTAA64.EFI used to package and smoke boot an arm64 ISO
        required: false
        type: string

jobs:
  build:
    name: Build Apple XNU ${{ matrix.arch }} kernel ISO
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app
          xcodebuild -version
          xcrun -sdk macosx --show-sdk-path

      - name: Install build tools
        run: brew install cmake ninja cdrtools xorriso mtools qemu llvm lld

      - name: Download optional XNU EFI loader
        id: efi_loader
        env:
          ARCH: ${{ matrix.arch }}
          INPUT_EFI_LOADER_URL_AMD64: ${{ inputs.xnu_efi_loader_url_amd64 }}
          INPUT_EFI_LOADER_URL_ARM64: ${{ inputs.xnu_efi_loader_url_arm64 }}
          VAR_EFI_LOADER_URL_AMD64: ${{ vars.XNU_EFI_LOADER_URL_AMD64 }}
          VAR_EFI_LOADER_URL_ARM64: ${{ vars.XNU_EFI_LOADER_URL_ARM64 }}
        run: |
          case "$ARCH" in
            amd64)
              efi_boot_name=BOOTX64.EFI
              efi_loader_url="${INPUT_EFI_LOADER_URL_AMD64:-$VAR_EFI_LOADER_URL_AMD64}"
              ;;
            arm64)
              efi_boot_name=BOOTAA64.EFI
              efi_loader_url="${INPUT_EFI_LOADER_URL_ARM64:-$VAR_EFI_LOADER_URL_ARM64}"
              ;;
            *)
              echo "Unsupported ARCH: $ARCH" >&2
              exit 2
              ;;
          esac

          if [ -z "$efi_loader_url" ]; then
            echo "No external XNU EFI loader URL configured for $ARCH; CI will use the bundled fallback loader."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p /tmp/xnu-efi-loader
          efi_loader="/tmp/xnu-efi-loader/$efi_boot_name"
          curl -L --fail --retry 3 "$efi_loader_url" -o "$efi_loader"
          test -s "$efi_loader"
          file "$efi_loader"
          echo "XNU_EFI_LOADER=$efi_loader" >> "$GITHUB_ENV"
          echo "path=$efi_loader" >> "$GITHUB_OUTPUT"

      - name: Build Apple XNU kernel and bootable ISO
        env:
          XNU_EFI_LOADER: ${{ steps.efi_loader.outputs.path }}
        run: |
          if [ -n "$XNU_EFI_LOADER" ]; then
            make ARCH=${{ matrix.arch }} XNU_EFI_LOADER="$XNU_EFI_LOADER" all
          else
            make ARCH=${{ matrix.arch }} all
          fi

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-xnu-kernel-${{ matrix.arch }}-artifacts
          path: |
            build/${{ matrix.arch }}/xnu-build/artifacts/xnu-kernel-artifacts.txt
            build/${{ matrix.arch }}/xnu-build/artifacts/**
          if-no-files-found: ignore

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-xnu-kernel-${{ matrix.arch }}-iso
          path: |
            build/${{ matrix.arch }}/apple-xnu-kernel-${{ matrix.arch }}.iso
            build/${{ matrix.arch }}/iso-contents.txt
            build/${{ matrix.arch }}/iso-eltorito.txt
          if-no-files-found: ignore

      - name: Smoke boot XNU EFI loader under UEFI
        run: make ARCH=${{ matrix.arch }} smoke-boot

      - name: Download external arm64 XNU artifact for handoff capture
        if: matrix.arch == 'arm64' && github.event_name == 'workflow_dispatch' && inputs.run_handoff_capture && inputs.xnu_kernel_artifact_url != ''
        run: |
          mkdir -p /tmp/xnu-kernel
          curl -L --fail --retry 3 "${{ inputs.xnu_kernel_artifact_url }}" -o /tmp/xnu-kernel/kernel.development
          file /tmp/xnu-kernel/kernel.development

      - name: Capture arm64 XNU handoff boot
        if: matrix.arch == 'arm64' && steps.efi_loader.outputs.path != '' && github.event_name == 'workflow_dispatch' && inputs.run_handoff_capture && inputs.xnu_kernel_artifact_url != ''
        run: |
          make ARCH=arm64 XNU_KERNEL_ARTIFACT=/tmp/xnu-kernel/kernel.development XNU_EFI_LOADER="${{ steps.efi_loader.outputs.path }}" iso verify smoke-boot

      - name: Upload smoke boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-xnu-kernel-${{ matrix.arch }}-efi-smoke
          path: |
            build/${{ matrix.arch }}/efi-smoke/*
          if-no-files-found: ignore

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-xnu-kernel-${{ matrix.arch }}-logs
          path: |
            build/${{ matrix.arch }}/xnu-build/*.log
          if-no-files-found: ignore
