name: Build Apple XNU kernel ISOs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Apple XNU ${{ matrix.arch }} kernel ISO
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app
          xcodebuild -version
          xcrun -sdk macosx --show-sdk-path

      - name: Install build tools
        run: brew install cmake ninja cdrtools xorriso

      - name: Build Apple XNU kernel and create ISO
        run: make ARCH=${{ matrix.arch }} all

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-xnu-kernel-${{ matrix.arch }}-logs
          path: |
            build/${{ matrix.arch }}/xnu-build/*.log
          if-no-files-found: ignore

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-xnu-kernel-${{ matrix.arch }}-iso
          path: |
            build/${{ matrix.arch }}/apple-xnu-kernel-${{ matrix.arch }}.iso
            build/${{ matrix.arch }}/iso-contents.txt
            build/${{ matrix.arch }}/xnu-build/artifacts/xnu-kernel-artifacts.txt
          if-no-files-found: error
