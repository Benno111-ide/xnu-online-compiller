name: Build basic XNU ISOs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }} ISO
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            file \
            genisoimage \
            git \
            make \
            xorriso

      - name: Fetch Apple XNU and create source ISO
        run: make ARCH=${{ matrix.arch }} all

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-xnu-source-${{ matrix.arch }}-iso
          path: |
            build/${{ matrix.arch }}/apple-xnu-source-${{ matrix.arch }}.iso
            build/${{ matrix.arch }}/iso-contents.txt
          if-no-files-found: error
