# name | mode | shell command
# once jobs are ordered startup barriers; a failure stops startup.
# respawn/console jobs must run in the foreground (use exec).
bootstrap | once | /bin/sh /etc/xnu-init/rc.boot
# Development rescue console, running as root. Replace with a getty/login
# service before using this root filesystem outside an isolated VM.
console | console | exec /bin/sh -i
